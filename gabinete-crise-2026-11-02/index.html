<script id="main">
const D = JSON.parse(document.getElementById('data').textContent);
let S = {updatedAt:'', oc:{}}; let LOG = [];
const app = document.getElementById('app');
const STATUSES = ['Aguardando','Em atendimento','Isolado','Concluído','Cancelado'];
const PRIO = ['Crítica','Alta','Média','Baixa'];
const PCOL = {'Crítica':'var(--crit)','Alta':'var(--alta)','Média':'var(--media)','Baixa':'var(--baixa)'};
const SCOL = {'Aguardando':'var(--s-ag)','Em atendimento':'var(--s-at)','Isolado':'var(--s-is)','Concluído':'var(--s-ok)','Cancelado':'var(--s-ca)'};
const SECS = [['SEINFRA','SEINFRA — Infraestrutura'],['SELURB','SELURB — Limpeza Urbana'],['DC','Defesa Civil'],['BM','Bombeiros Militar'],['GCM','GCM']];
let dirty = {};
let canWrite = false; let AUTH = {pin:'', name:''}; try{ AUTH = JSON.parse(localStorage.getItem('painel-auth')||'{}'); canWrite = !!AUTH.pin; }catch(e){}
const F = {p:new Set(), s:new Set(), org:'', b:'', q:'', pend:false};
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function rec(id){ return Object.assign({}, S.oc[id]||{}, dirty[id]||{}); }
function statusOf(o){ return rec(o.id).s || o.s0; }
function region(b){ const parts = (b||'').split(' / ').map(x=>x.trim()).filter(Boolean); if(!parts.length) return ''; const nz = parts.filter(x=>!/^Zona \d/.test(x) && !/provável/.test(x)); return (nz[0] || parts[0]).replace(/ \(provável\)/,''); }
function isDone(o){ const s = statusOf(o); return s==='Concluído' || s==='Cancelado'; }
function pendOf(list){ return list.filter(o => !isDone(o)); }

// ---------- KPIs ----------
function renderKpis(){
  const all = D.occs, pend = pendOf(all);
  const crit = pend.filter(o=>o.p==='Crítica').length, alta = pend.filter(o=>o.p==='Alta').length;
  const fio = pend.filter(o=>o.fio).length;
  const vul = pend.filter(o=>/idos[oa]s?/i.test(o.end)).length;
  const esc_ = all.filter(o=>/Esc\. Mun|CMEI Benedito|Col\. Est/.test(o.end)).length;
  const at = all.filter(o=>statusOf(o)==='Em atendimento').length, ok = all.filter(o=>statusOf(o)==='Concluído').length;
  const pct = Math.round(100*ok/all.length);
  const conf = pend.filter(o=>o.flag).length;
  const k = [
    ['Críticas pendentes', crit, 'crit'+(crit?' pulse':''), 'de '+all.filter(o=>o.p==='Crítica').length],
    ['Altas pendentes', alta, 'alta', 'de '+all.filter(o=>o.p==='Alta').length],
    ['Fiação / Copel pendentes', fio, 'crit', 'presumir energizada'],
    ['Vulneráveis confinados', vul, 'crit'+(vul?' pulse':''), 'idosos — risco humano'],
    ['Junto a escolas / CMEIs', esc_, 'alta', 'aulas voltam 03/11'],
    ['Em atendimento agora', at, 'acc', 'equipes em campo'],
    ['Concluídas', ok+' · '+pct+'%', 'ok', 'de '+all.length+' ocorrências'],
    ['Endereço a confirmar', conf, 'warn', 'validar em campo'],
  ];
  return '<div class="kpis">' + k.map(([l,v,c,s]) => `<div class="kpi ${c}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('') + '</div>';
}
// ---------- charts ----------
function stackedBars(rows, maxV){
  return '<div class="bars">' + rows.map(([lab, segs, tot]) => `<div class="lab" title="${esc(lab)}">${esc(lab)}</div><div class="bar">${segs.map(([n,col]) => n? `<span style="width:${(100*n/maxV).toFixed(1)}%;background:${col}" title="${n}"></span>`:'').join('')}</div><div class="n">${tot}</div>`).join('') + '</div>';
}
function renderCharts(){
  const all = D.occs;
  const byP = PRIO.map(p => { const L = all.filter(o=>o.p===p); return [p, STATUSES.map(s => [L.filter(o=>statusOf(o)===s).length, SCOL[s]]), L.length]; });
  const maxP = Math.max(...byP.map(r=>r[2]));
  const bySec = SECS.map(([sig,nome]) => { const L = all.filter(o=>o.org.includes(sig)); const pend = pendOf(L).length; return [nome, [[pend, PCOL['Crítica']],[L.length-pend, SCOL['Concluído']]], L.length]; });
  const maxS = Math.max(...bySec.map(r=>r[2]));
  const types = [...new Set(all.map(o=>o.tipo))];
  const byT = types.map(t => { const L = all.filter(o=>o.tipo===t); return [t, PRIO.map(p => [pendOf(L).filter(o=>o.p===p).length, PCOL[p]]), L.length]; }).sort((a,b)=>b[2]-a[2]);
  const maxT = Math.max(...byT.map(r=>r[2]));
  const bairros = {};
  all.forEach(o => { const b = region(o.b); if(b && !isDone(o)){ bairros[b] = (bairros[b]||0)+1; } });
  const byB = Object.entries(bairros).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([b,n]) => [b, [[n, 'var(--accent)']], n]);
  const maxB = Math.max(1, ...byB.map(r=>r[2]));
  const legS = '<div class="legend">' + STATUSES.map(s=>`<span><i style="background:${SCOL[s]}"></i>${s}</span>`).join('') + '</div>';
  const legP = '<div class="legend">' + PRIO.map(p=>`<span><i style="background:${PCOL[p]}"></i>${p} (pendentes)</span>`).join('') + '</div>';
  return `<div class="grid2">
    <div class="card"><h3>Prioridade × status</h3>${stackedBars(byP, maxP)}${legS}</div>
    <div class="card"><h3>Secretaria / órgão — pendentes vs concluídas</h3>${stackedBars(bySec, maxS)}<div class="legend"><span><i style="background:${PCOL['Crítica']}"></i>Pendentes</span><span><i style="background:${SCOL['Concluído']}"></i>Concluídas / canceladas</span></div></div>
    <div class="card"><h3>Tipologia do dano (pendentes por prioridade)</h3>${stackedBars(byT, maxT)}${legP}</div>
    <div class="card"><h3>Bairros com mais pendências</h3>${byB.length? stackedBars(byB, maxB) : '<p class="notice">Nenhuma pendência.</p>'}</div>
  </div>`;
}
// ---------- schematic map ----------
function renderMap(){
  const pts = D.occs.filter(o=>o.lat && o.lon);
  if(!pts.length) return '';
  const lats = pts.map(o=>o.lat), lons = pts.map(o=>o.lon);
  const la0 = Math.min(...lats), la1 = Math.max(...lats), lo0 = Math.min(...lons), lo1 = Math.max(...lons);
  const W = 900, H = 520, pad = 48;
  const kx = Math.cos(((la0+la1)/2)*Math.PI/180);
  const sx = (W-2*pad)/((lo1-lo0)*kx || 1), sy = (H-2*pad)/((la1-la0) || 1), s = Math.min(sx, sy);
  const X = lon => pad + (lon-lo0)*kx*s + ((W-2*pad)-(lo1-lo0)*kx*s)/2, Y = lat => H-pad - (lat-la0)*s - ((H-2*pad)-(la1-la0)*s)/2;
  const groups = {};
  pts.forEach(o => { const b = region(o.b); if(!b) return; (groups[b] = groups[b]||[]).push(o); });
  const labs = Object.entries(groups).filter(([b,L])=>L.length>=2).map(([b,L]) => ({b, n:L.length, x: L.reduce((a,o)=>a+X(o.lon),0)/L.length, y: L.reduce((a,o)=>a+Y(o.lat),0)/L.length - 16 - L.length})).sort((a,b)=>a.y-b.y||a.x-b.x);
  for(let i=0;i<labs.length;i++) for(let j=0;j<i;j++){ if(Math.abs(labs[i].x-labs[j].x)<150 && Math.abs(labs[i].y-labs[j].y)<15) labs[i].y = labs[j].y + 15; }
  const labels = labs.map(l => `<text x="${l.x.toFixed(0)}" y="${l.y.toFixed(0)}" text-anchor="middle" font-weight="600">${esc(l.b)} (${l.n})</text>`).join('');
  const leg = '<div class="legend">' + PRIO.map(p=>`<span><i style="background:${PCOL[p]};border-radius:50%"></i>${p}</span>`).join('') + '<span>Norte ↑ · tamanho = nº de fotos · apagado = concluído · posição relativa, sem ruas</span></div>';
  const circles = pts.map(o => `<circle cx="${X(o.lon).toFixed(1)}" cy="${Y(o.lat).toFixed(1)}" r="${(5+Math.min(o.fotos.length,10)*0.8).toFixed(1)}" fill="${PCOL[o.p]}" class="${isDone(o)?'done':''}" data-id="${o.id}"><title>${esc(o.id+' · '+o.p+' · '+o.end)}</title></circle>`).join('');
  return `<div class="card"><h3>Mapa esquemático dos pontos com GPS (${pts.length} de ${D.occs.length}) — toque num ponto para abrir a ocorrência</h3><div class="mapwrap"><svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribuição geográfica das ocorrências">${labels}${circles}</svg></div>${leg}</div>`;
}
// ---------- occurrence cards ----------
function card(o){
  const r = rec(o.id), st = statusOf(o), done = isDone(o);
  const rank = o.rank ? `<span class="rank ${o.rank>5?'next':''}" title="Ordem de despacho sugerida">#${o.rank}</span>` : '';
  const thumbs = o.fotos.slice(0,6).map((f,i) => `<a href="${f.img}" data-lb="${o.id}" data-i="${i}" title="${esc(f.h+' · '+f.d)}"><img loading="lazy" src="${f.t}" alt="${esc(f.k+' '+f.f)}"></a>`).join('') + (o.fotos.length>6 ? `<a href="${o.fotos[6].img}" data-lb="${o.id}" data-i="6"><div class="more">+${o.fotos.length-6} fotos</div></a>` : '');
  const maplink = o.gm ? `<a href="${o.gm}" target="_blank" rel="noopener">📍 Abrir no mapa (GPS)</a>` : (o.gs ? `<a href="${o.gs}" target="_blank" rel="noopener">🔎 Buscar endereço no mapa</a>` : '');
  const tm = o.tm ? `<a href="${o.tm}" target="_blank" rel="noopener">Timemark</a>` : '';
  const changed = dirty[o.id] ? ' changed' : '';
  const who = r.t ? `<div class="who">Última alteração: ${esc(r.t)}${r.by?' por '+esc(r.by):''}</div>` : '';
  return `<article class="oc ${o.p} ${done?'done':''}" id="${o.id}" data-id="${o.id}">
    <div class="head"><span class="id">${o.id}</span><span class="chip ${o.p}">${o.p}</span><span class="st" data-s="${esc(st)}">${esc(st)}</span>${rank}${o.fio?'<span class="chip" style="background:var(--surface2);color:var(--fg);border:1px solid var(--line)">⚡ fiação</span>':''}${o.flag?'<span class="chip" style="background:var(--surface2);color:var(--warn);border:1px solid var(--line)">endereço a confirmar</span>':''}</div>
    <div class="addr ${o.flag?'flag':''}">${esc(o.end)}</div>
    <div class="meta"><span><b>${esc(o.b||'—')}</b></span><span>${esc(o.tipo)}${o.tipos!==o.tipo?' <i>(+ '+esc(o.tipos.replace(o.tipo+' + ',''))+')</i>':''}</span><span>Obstrução: <b>${esc(o.obst)}</b></span><span>Hora: <b>${esc(o.h)}</b></span><span>Por: <b>${esc(o.resp)}</b></span><span>${o.fotos.length} mídia(s)</span></div>
    ${o.resumo?`<div class="resumo">${esc(o.resumo)}</div>`:''}
    <div class="os"><b>${esc(o.org)}</b> — ${esc(o.os)}</div>
    ${o.risco?`<div class="risk">⚠︎ ${esc(o.risco)}</div>`:''}
    <div class="thumbs">${thumbs}</div>
    <div class="links">${o.lat?`<a class="mapbtn" data-map="${o.id}">🗺 Ver no mapa${o.approx?' (aprox.)':''}</a>`:''}${maplink}${tm}</div>
    <div class="edit"><div class="${changed?'changed':''}"><label>Status</label><select data-k="s" data-id="${o.id}">${STATUSES.map(s=>`<option ${s===st?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="${changed?'changed':''}"><label>Equipe designada</label><input data-k="e" data-id="${o.id}" value="${esc(r.e||'')}" placeholder="ex.: SEINFRA motosserra 2"></div>
      <div class="${changed?'changed':''}"><label>Observação da sala</label><input data-k="o" data-id="${o.id}" value="${esc(r.o||'')}" placeholder="ex.: Copel liberou 08:40"></div>${who}</div>
  </article>`;
}
function filtered(){
  const q = F.q.trim().toLowerCase();
  return D.occs.filter(o => (!F.p.size || F.p.has(o.p)) && (!F.s.size || F.s.has(statusOf(o))) && (!F.org || o.org.includes(F.org)) && (!F.b || region(o.b)===F.b) && (!F.pend || !isDone(o))
    && (!q || (o.id+' '+o.end+' '+o.b+' '+o.tipo+' '+o.org+' '+o.resp+' '+(rec(o.id).e||'')).toLowerCase().includes(q)));
}
function renderList(){
  const L = filtered();
  document.getElementById('count').textContent = L.length + ' de ' + D.occs.length;
  document.getElementById('list').innerHTML = L.length ? L.map(card).join('') : '<p class="notice">Nenhuma ocorrência com esses filtros.</p>';
}
function renderAlerts(){
  const L = D.occs.filter(o=>o.rank).sort((a,b)=>a.rank-b.rank);
  return `<div class="tablewrap"><table class="tx"><thead><tr><th>#</th><th>Ocorrência</th><th>Prioridade</th><th>Status</th><th>Órgão</th><th>Equipe</th></tr></thead><tbody>` +
    L.map(o => `<tr><td><b>${o.rank}</b></td><td><a href="#${o.id}">${esc(o.end)}</a></td><td><span class="chip ${o.p}">${o.p}</span></td><td><span class="st" data-s="${esc(statusOf(o))}">${esc(statusOf(o))}</span></td><td>${esc(o.org)}</td><td>${esc(rec(o.id).e||'—')}</td></tr>`).join('') + '</tbody></table></div>';
}
function renderText(){
  return `<details><summary>Relatos sem mídia, localizações e áudios (${D.text.length})</summary><div class="tablewrap"><table class="tx"><thead><tr><th>Hora</th><th>Quem</th><th>Local / relato</th><th>Detalhe</th><th>Prior.</th><th>Status</th><th></th></tr></thead><tbody>` +
    D.text.map(t => `<tr><td>${esc(t.h)}</td><td>${esc(t.who)}</td><td>${esc(t.local)}${t.b?'<br><small>'+esc(t.b)+'</small>':''}</td><td>${esc(t.det)}</td><td><span class="chip ${t.p}">${t.p}</span></td><td>${esc(t.s)}</td><td>${t.map?`<a href="${t.map}" target="_blank" rel="noopener">mapa</a>`:''}</td></tr>`).join('') + '</tbody></table></div></details>';
}
function renderAll(){
  const n = Object.keys(dirty).length;
  const bairros = [...new Set(D.occs.map(o=>region(o.b)).filter(Boolean))].sort();
  app.innerHTML = `
  <header class="top"><div class="wrap">
    <h1>Painel do Gabinete de Crise — Tempestade 02/11/2026 · Maringá<small>Fonte: Equipe APOIO SESP (WhatsApp, 2 exports) · consolidado ${esc(D.gen)} · ${S.updatedAt?'status atualizado '+esc(S.updatedAt):'status ainda não atualizado pelo gabinete'}</small></h1>
    <div class="actions"><a class="btn" href="${D.gs}" target="_blank" rel="noopener">📊 Planilha</a><button class="btn" id="refresh">↻ Atualizar</button><button class="btn primary" id="save">${canWrite ? ('✏️ Editando como '+esc(AUTH.name||'gabinete')+' · sair') : '🔐 Entrar para editar'}</button></div>
  </div></header>
  <div class="wrap ${canWrite?'':'ro'}">
    <div id="mode" class="notice">${canWrite ? '<b>Modo edição.</b> Altere Status / Equipe / Observação direto nos cartões — cada alteração é gravada na hora e aparece para todos (atualização automática a cada 30 s).' : '<b>Modo leitura.</b> Para atualizar status, clique em <b>Entrar para editar</b> e informe o PIN do gabinete e seu nome. Os dados são atualizados automaticamente a cada 30 s.'}<span id="sync" style="margin-left:8px"></span></div>
    <h2>Indicadores de urgência</h2>${renderKpis()}
    <h2>Panorama</h2>${renderCharts()}
    <h2>Mapa (OpenStreetMap)</h2><div class="card"><div id="map"></div><div class="legend"><span><i style="background:var(--crit);border-radius:50%"></i>Crítica</span><span><i style="background:var(--alta);border-radius:50%"></i>Alta</span><span><i style="background:var(--media);border-radius:50%"></i>Média</span><span><i style="background:var(--baixa);border-radius:50%"></i>Baixa</span><span>contorno tracejado = posição aproximada (rua) · apagado = concluído</span></div></div>
    <h2>Últimas atualizações do gabinete</h2><div class="card" id="logbox">${renderLog()}</div>
    <h2>Alerta imediato — ordem de despacho sugerida</h2><div class="card">${renderAlerts()}</div>
    <h2>Ocorrências (${D.occs.length})</h2>
    <div class="filters">
      <input type="search" id="q" placeholder="Buscar rua, bairro, ID, equipe…" value="${esc(F.q)}">
      ${PRIO.map(p=>`<button class="tog ${p}" data-f="p" data-v="${p}" aria-pressed="${F.p.has(p)}">${p}</button>`).join('')}
      <button class="tog" data-f="pend" aria-pressed="${F.pend}">Só pendentes</button>
      <select id="fs"><option value="">Status: todos</option>${STATUSES.map(s=>`<option ${F.s.has(s)?'selected':''}>${s}</option>`).join('')}</select>
      <select id="forg"><option value="">Órgão: todos</option>${SECS.map(([sig,n])=>`<option value="${sig}" ${F.org===sig?'selected':''}>${n}</option>`).join('')}</select>
      <select id="fb"><option value="">Bairro: todos</option>${bairros.map(b=>`<option ${F.b===b?'selected':''}>${esc(b)}</option>`).join('')}</select>
      <span class="count" id="count"></span>
    </div>
    <div class="list" id="list"></div>
    <h2>Outros registros</h2>${renderText()}
    <div class="foot">Critérios — <b>Crítica</b>: poste/fiação caída (presumir energizada até liberação da Copel), morador vulnerável confinado, escola/CMEI atingido, árvore sobre casa com fiação · <b>Alta</b>: bloqueio total de via, árvore sobre casa/veículo, árvore com fiação enroscada, equipamento público de lazer, entulho em frente a escola, árvore com risco iminente de queda · <b>Média</b>: obstrução parcial, galhos/entulho, letreiros · <b>Baixa</b>: apoio interno. Copel Emergência 0800 51 00 116 · Defesa Civil 199 · Bombeiros 193. Classificação visual feita sobre as fotos reduzidas — confirmar em campo. 7 áudios do grupo não foram transcritos.</div>
  </div>`;
  renderList();
  wire();
  setHH();
  initMap();
}
function renderLog(){
  if(!LOG.length) return '<span style="color:var(--muted)">Nenhuma alteração registrada ainda.</span>';
  return '<div class="log">' + LOG.slice(0,15).map(l => { const o = D.occs.find(x=>x.id===l.oc_id); return `<div><span class="t">${esc(fmtT(l.created_at))}</span><span class="st" data-s="${esc(l.status)}">${esc(l.status)}</span><a href="#${l.oc_id}">${l.oc_id}</a><span>${esc(o?o.end.slice(0,60):'')}</span>${l.equipe?`<span>· ${esc(l.equipe)}</span>`:''}${l.obs?`<span>· ${esc(l.obs)}</span>`:''}${l.updated_by?`<span style="color:var(--muted)">— ${esc(l.updated_by)}</span>`:''}</div>`; }).join('') + '</div>';
}
function fmtT(iso){ const d = new Date(iso); const p = n => String(n).padStart(2,'0'); return isNaN(d) ? '' : `${p(d.getDate())}/${p(d.getMonth()+1)} ${p(d.getHours())}:${p(d.getMinutes())}`; }
// ---------- Leaflet / OSM ----------
let MAP = null, MARK = {};
function initMap(){
  if(!window.L) return;
  const pts = D.occs.filter(o=>o.lat);
  MAP = L.map('map', {scrollWheelZoom:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(MAP);
  const col = {'Crítica':'#b3261e','Alta':'#d9640d','Média':'#c79a00','Baixa':'#2e7d4f'};
  pts.forEach(o => {
    const m = L.circleMarker([o.lat, o.lon], {radius: 7 + Math.min(o.fotos.length, 10)*0.6, color: col[o.p], weight: 2, fillColor: col[o.p], fillOpacity: isDone(o)?0.15:0.75, opacity: isDone(o)?0.4:1, dashArray: o.approx?'3,4':null}).addTo(MAP);
    m.bindPopup(() => `<b>${o.id} · ${o.p}${o.approx?' · posição aproximada':''}</b>${esc(o.end)}<br><span class="st" data-s="${esc(statusOf(o))}">${esc(statusOf(o))}</span> · ${esc(o.tipo)}<div class="pp"><button onclick="goTo('${o.id}')">Ver ficha</button>${o.gm?`<a href="${o.gm}" target="_blank" rel="noopener">Google Maps</a>`:''}</div>`);
    MARK[o.id] = m;
  });
  if(pts.length) MAP.fitBounds(L.latLngBounds(pts.map(o=>[o.lat,o.lon])).pad(0.08));
}
function refreshMarkers(){ if(!MAP) return; D.occs.forEach(o => { const m = MARK[o.id]; if(m){ m.setStyle({fillOpacity: isDone(o)?0.15:0.75, opacity: isDone(o)?0.4:1}); } }); }
function showOnMap(id){ const m = MARK[id]; if(!m || !MAP) return; document.getElementById('map').scrollIntoView({behavior:'smooth', block:'center'}); MAP.setView(m.getLatLng(), 17); m.openPopup(); }
// ---------- lightbox ----------
function openLb(ocId, i){
  const o = D.occs.find(x=>x.id===ocId); if(!o) return;
  let idx = i;
  const lb = document.createElement('div'); lb.className = 'lb';
  const draw = () => { const f = o.fotos[idx]; lb.innerHTML = `<img src="${f.img}" alt=""><div class="cap"><b>${o.id}</b> · ${esc(f.f)} · ${esc(f.h)} · ${esc(f.who)}<br>${esc(f.d)}</div><div class="nav"><button data-a="p">‹ Anterior</button><span style="color:#fff;align-self:center">${idx+1}/${o.fotos.length}</span><button data-a="n">Próxima ›</button><button data-a="x">Fechar ✕</button></div>`; };
  draw();
  lb.addEventListener('click', e => { const a = e.target.dataset.a; if(a==='p'){ idx = (idx-1+o.fotos.length)%o.fotos.length; draw(); } else if(a==='n'){ idx = (idx+1)%o.fotos.length; draw(); } else if(a==='x' || e.target===lb){ lb.remove(); } });
  document.body.appendChild(lb);
}
function setHH(){ const h = document.querySelector('header.top'); if(h) document.documentElement.style.setProperty('--hh', h.offsetHeight + 'px'); }
window.addEventListener('resize', setHH);
function wire(){
  document.getElementById('q').addEventListener('input', e => { F.q = e.target.value; renderList(); });
  document.querySelectorAll('.tog').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.f==='p'){ F.p.has(b.dataset.v) ? F.p.delete(b.dataset.v) : F.p.add(b.dataset.v); } else { F.pend = !F.pend; }
    b.setAttribute('aria-pressed', b.dataset.f==='p' ? F.p.has(b.dataset.v) : F.pend); renderList();
  }));
  document.getElementById('fs').addEventListener('change', e => { F.s = new Set(e.target.value ? [e.target.value] : []); renderList(); });
  document.getElementById('forg').addEventListener('change', e => { F.org = e.target.value; renderList(); });
  document.getElementById('fb').addEventListener('change', e => { F.b = e.target.value; renderList(); });
  document.getElementById('list').addEventListener('change', onEdit);
  document.getElementById('list').addEventListener('input', e => { if(e.target.tagName==='INPUT') onEdit(e); });
  document.getElementById('save').addEventListener('click', () => { if(canWrite){ canWrite = false; AUTH = {pin:'',name:''}; try{ localStorage.removeItem('painel-auth'); }catch(e){} renderAll(); } else askPin(); });
  document.getElementById('refresh').addEventListener('click', () => loadState(true));
  document.getElementById('list').addEventListener('click', e => { const a = e.target.closest('a[data-lb]'); if(a){ e.preventDefault(); openLb(a.dataset.lb, +a.dataset.i); return; } const mb = e.target.closest('a[data-map]'); if(mb){ e.preventDefault(); showOnMap(mb.dataset.map); } });
}

const timers = {};
function onEdit(e){
  const el = e.target, id = el.dataset.id, k = el.dataset.k; if(!id || !k) return;
  if(!canWrite){ askPin(); return; }
  const art = el.closest('.oc');
  if(k==='s'){ const st = art.querySelector('.st'); st.textContent = el.value; st.dataset.s = el.value; art.classList.toggle('done', el.value==='Concluído'||el.value==='Cancelado'); }
  clearTimeout(timers[id]);
  art.classList.add('saving'); art.classList.remove('saved','err');
  timers[id] = setTimeout(() => saveOc(id, art), k==='s' ? 150 : 900);
}
async function saveOc(id, art){
  const o = D.occs.find(x=>x.id===id);
  const g = k => (art.querySelector(`[data-k="${k}"][data-id="${id}"]`)||{}).value || '';
  const row = {oc_id:id, status:g('s')||o.s0, equipe:g('e'), obs:g('o'), updated_by: AUTH.name||''};
  try{
    const r = await fetch(D.sb + '/rest/v1/crise_ocorrencias_status?on_conflict=oc_id', {method:'POST', headers:{'apikey':D.key, 'Authorization':'Bearer '+D.key, 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=representation', 'x-painel-pin':AUTH.pin}, body: JSON.stringify(row)});
    if(r.status===401 || r.status===403 || r.status===400){ const txt = await r.text(); if(/row-level security|42501|policy/i.test(txt) || r.status===401){ art.classList.remove('saving'); art.classList.add('err'); toast('PIN incorreto — entre de novo para editar.'); canWrite=false; AUTH={pin:'',name:''}; try{ localStorage.removeItem('painel-auth'); }catch(e){} renderAll(); return; } throw new Error(txt); }
    if(!r.ok) throw new Error(await r.text());
    const saved = (await r.json())[0];
    S.oc[id] = {s:saved.status, e:saved.equipe, o:saved.obs, t:fmtT(saved.updated_at), by:saved.updated_by};
    art.classList.remove('saving'); art.classList.add('saved'); setTimeout(()=>art.classList.remove('saved'), 1500);
    const who = art.querySelector('.who'); if(who) who.textContent = 'Última alteração: ' + S.oc[id].t + (saved.updated_by?' por '+saved.updated_by:'');
    document.querySelector('.kpis').outerHTML = renderKpis();
    refreshMarkers();
    loadLog();
  }catch(err){ art.classList.remove('saving'); art.classList.add('err'); toast('Não foi possível gravar: ' + (err.message||'erro de rede') + '. Tente de novo.'); }
}
function askPin(){
  const box = document.createElement('div'); box.className = 'pinbox';
  box.innerHTML = `<form><h3>Entrar para editar</h3><p style="margin:0;color:var(--muted);font-size:13px">Informe o PIN do gabinete de crise e seu nome (aparece no histórico das alterações).</p><input id="pin" type="password" placeholder="PIN do gabinete" autocomplete="off" required><input id="nm" placeholder="Seu nome / função (ex.: Alison — SESP)" value="${esc(AUTH.name||'')}" required><div class="row"><button type="button" class="btn" id="c">Cancelar</button><button class="btn primary">Entrar</button></div></form>`;
  document.body.appendChild(box);
  box.querySelector('#c').onclick = () => box.remove();
  box.querySelector('form').onsubmit = async e => {
    e.preventDefault();
    const pin = box.querySelector('#pin').value.trim(), nm = box.querySelector('#nm').value.trim();
    // validate PIN with a harmless upsert on a probe row
    const r = await fetch(D.sb + '/rest/v1/crise_ocorrencias_status?on_conflict=oc_id', {method:'POST', headers:{'apikey':D.key, 'Authorization':'Bearer '+D.key, 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates', 'x-painel-pin':pin}, body: JSON.stringify({oc_id:'OC-PING', status:'Aguardando', updated_by:nm})}).catch(()=>null);
    if(r && (r.status===201 || r.status===200 || r.status===204)){ AUTH = {pin, name:nm}; canWrite = true; try{ localStorage.setItem('painel-auth', JSON.stringify(AUTH)); }catch(e){} box.remove(); renderAll(); toast('Modo edição ativado — altere os status direto nos cartões.'); }
    else { box.querySelector('#pin').value=''; box.querySelector('#pin').placeholder='PIN incorreto — tente de novo'; }
  };
  setTimeout(()=>box.querySelector('#pin').focus(), 50);
}
// ---------- load shared state ----------
let lastLoad = 0;
async function loadState(manual){
  const sync = document.getElementById('sync');
  try{
    const r = await fetch(D.sb + '/rest/v1/crise_ocorrencias_status?select=oc_id,status,equipe,obs,updated_by,updated_at&order=updated_at.desc', {headers:{'apikey':D.key, 'Authorization':'Bearer '+D.key}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows = await r.json();
    const next = {}; let latest = '';
    rows.forEach(x => { if(x.oc_id==='OC-PING') return; next[x.oc_id] = {s:x.status, e:x.equipe, o:x.obs, t:fmtT(x.updated_at), by:x.updated_by}; if(!latest) latest = fmtT(x.updated_at); });
    const changed = JSON.stringify(next) !== JSON.stringify(S.oc);
    S = {updatedAt: latest, oc: next};
    await loadLog();
    if(changed || manual){ if(document.activeElement && document.activeElement.closest && document.activeElement.closest('.edit')){ /* não interromper quem está digitando */ } else renderAll(); }
    if(sync) sync.textContent = '· sincronizado ' + fmtT(new Date().toISOString());
  }catch(err){ if(sync) sync.textContent = '· sem conexão com o servidor de status (' + (err.message||'') + ')'; }
}
async function loadLog(){
  try{ const r = await fetch(D.sb + '/rest/v1/crise_log?select=oc_id,status,equipe,obs,updated_by,created_at&oc_id=neq.OC-PING&order=created_at.desc&limit=15', {headers:{'apikey':D.key, 'Authorization':'Bearer '+D.key}}); if(r.ok){ LOG = await r.json(); const lb = document.getElementById('logbox'); if(lb) lb.innerHTML = renderLog(); } }catch(e){}
}
let toastT;
function toast(msg){ let t = document.querySelector('.toast'); if(!t){ t = document.createElement('div'); t.className='toast'; document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 6000); }
function goTo(id){
  F.p.clear(); F.s.clear(); F.org=''; F.b=''; F.q=''; F.pend=false;
  if(!document.getElementById(id)) renderAll();
  const el = document.getElementById(id); if(!el) return;
  document.querySelectorAll('.oc.hl').forEach(x=>x.classList.remove('hl')); el.classList.add('hl');
  const off = (document.querySelector('header.top')||{offsetHeight:0}).offsetHeight + (document.querySelector('.filters')||{offsetHeight:0}).offsetHeight + 12;
  window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - off, behavior:'smooth'});
}
window.addEventListener('hashchange', () => { const id = location.hash.replace('#',''); if(/^OC-\d+$/.test(id)) goTo(id); });

renderAll();
const id0 = location.hash.replace('#',''); if(/^OC-\d+$/.test(id0)) setTimeout(()=>goTo(id0), 300);
loadState(false); setInterval(() => loadState(false), 30000);
</script>
</body>
</html>
